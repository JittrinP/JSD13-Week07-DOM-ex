<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JSD13_Week07_CookieClicker_Homework</title>
    <link rel="stylesheet" href="index.css" />

        <div class="storyHeader">

          <div id="PPS">+0 EP/s</div>

        <div class="status">
